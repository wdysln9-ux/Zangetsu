<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zangetsu UI Preview</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#111114;--panel2:#19191e;--text:#f4f4f5;--muted:#a1a1aa;--line:#29292f;--accent:#f04452;--accent-soft:#35191e;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body.light{color-scheme:light;--bg:#f5f5f7;--panel:#fff;--panel2:#eeeef2;--text:#18181b;--muted:#666671;--line:#dedee5;--accent:#d92e40;--accent-soft:#fbe8eb}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}.sidebar{border-right:1px solid var(--line);padding:22px 14px;background:var(--panel);display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;padding:0 9px;font-weight:800;font-size:18px;letter-spacing:.2px}.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:white;font-weight:900}.section-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:800;padding:0 10px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button,.folder-link{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 12px;border-radius:11px;background:transparent;color:var(--muted)}.nav button.active{background:var(--accent-soft);color:var(--text);font-weight:700}.nav .ico{width:20px;text-align:center;font-size:16px}.folder-link{padding:8px 11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--accent));flex:none}.folder-link span:nth-child(2){flex:1}.count{font-size:11px;color:var(--muted)}.side-bottom{margin-top:auto;padding:12px 10px;color:var(--muted);font-size:11px}.main{min-width:0;padding:28px clamp(18px,4vw,54px) 44px}.topbar{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:30px}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.small-btn{background:var(--panel2);border:1px solid var(--line);padding:9px 12px;border-radius:10px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--accent);font-weight:800;text-transform:uppercase}.hero h1{font-size:clamp(28px,4vw,38px);line-height:1.1;margin:7px 0 8px;letter-spacing:-1.2px}.hero p{margin:0;color:var(--muted)}.primary{background:var(--accent);color:white;padding:11px 15px;border-radius:11px;font-weight:750;white-space:nowrap}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--text);outline:none}.filter{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--muted)}.folder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.folder-card{min-width:0;display:grid;grid-template-columns:106px minmax(0,1fr);gap:15px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);transition:transform .15s,border-color .15s}.folder-card:hover{transform:translateY(-2px);border-color:var(--accent)}.stack{height:94px;position:relative;min-width:0}.poster{position:absolute;top:4px;width:57px;height:82px;border-radius:7px;object-fit:cover;border:2px solid var(--panel);box-shadow:0 5px 14px #0005}.poster:nth-child(1){left:0;transform:rotate(-7deg)}.poster:nth-child(2){left:25px;top:0;z-index:2}.poster:nth-child(3){left:49px;top:5px;transform:rotate(7deg)}.folder-info{min-width:0}.folder-title{font-size:15px;font-weight:750;display:flex;align-items:center;gap:8px;margin-bottom:5px}.folder-info p{font-size:12px;color:var(--muted);margin:0 0 10px}.mini-row{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:11px}.mini-row .tiny-dot{width:5px;height:5px;border-radius:50%;background:var(--dot,var(--accent))}.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px}.anime-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.anime-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--panel2)}.anime-card div{padding:10px}.anime-card strong{display:block;font-size:12px;line-height:1.4}.anime-card small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);grid-column:1/-1}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 15px;border-radius:10px;box-shadow:0 8px 30px #0004;display:none;z-index:9}.note{margin-top:30px;border:1px solid var(--line);background:var(--panel);padding:13px 15px;border-radius:12px;color:var(--muted);font-size:12px}.note strong{color:var(--text)}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px;gap:12px}.brand{padding:2px 5px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{justify-content:center;padding:9px 5px;font-size:12px}.nav .ico{width:auto}.folder-nav,.side-bottom{display:none}.main{padding:22px 14px}.folder-grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.folder-card{grid-template-columns:100px minmax(0,1fr)}}@media(min-width:1200px){.folder-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><span class="logo">Z</span><span>Zangetsu <span style="color:var(--muted);font-weight:500">Preview</span></span></div>
<div><div class="section-label">MENU</div><nav class="nav" aria-label="Navigasi utama">
<button class="active" data-page="list"><span class="ico">▤</span> My List</button>
<button data-page="discover"><span class="ico">⌕</span> Discover</button>
<button data-page="settings"><span class="ico">⚙</span> Settings</button>
</nav></div>
<div class="folder-nav"><div class="section-label">KOLEKSI</div><div id="folderNav"></div></div>
<div class="side-bottom">UI playground · data contoh<br>Terpisah dari aplikasi Android</div>
</aside>
<main class="main">
<div class="topbar"><div class="crumb">Workspace / <span id="crumb">My List</span></div><div class="top-actions"><button class="small-btn" id="themeBtn" title="Ganti tema">☼ Tema</button><button class="small-btn" id="resetBtn" title="Reset data preview">↻ Reset</button></div></div>
<section id="content"></section>
<div class="note"><strong>Preview UI saja.</strong> Data anime dan interaksi di halaman ini hanya contoh lokal. Tidak mengubah data akun, aplikasi Android, atau build APK Zangetsu.</div>
</main>
</div><div class="toast" id="toast"></div>
<script>
const art=[
{title:"Frieren: Beyond Journey's End",ep:"Episode 28",img:"https://image.tmdb.org/t/p/w342/yp8vEzye0QHh9G6B5LGoL7n2gJp.jpg"},
{title:"The Apothecary Diaries",ep:"Episode 24",img:"https://image.tmdb.org/t/p/w342/e3ojpANrFnmJCb5l6wM5SzBkc2E.jpg"},
{title:"Dungeon Meshi",ep:"Episode 24",img:"https://image.tmdb.org/t/p/w342/6G2fLCVm9fiLyHvBrccq6GSe2ih.jpg"},
{title:"Blue Lock",ep:"Episode 12",img:"https://image.tmdb.org/t/p/w342/1bHj9c3X7jQx3sQ8V3j7YvY3qJj.jpg"},
{title:"Mob Psycho 100",ep:"Episode 12",img:"https://image.tmdb.org/t/p/w342/vV5q5q3YqQxZ4g8kQ0xQfM3fQz.jpg"},
{title:"Spy x Family",ep:"Episode 25",img:"https://image.tmdb.org/t/p/w342/3r4LYFuXrg3G8fepysr4xSLWnQL.jpg"},
{title:"Bocchi the Rock!",ep:"Episode 12",img:"https://image.tmdb.org/t/p/w342/2m2wX4Yw8Xn3Q1m5Y5Qxqg9g.jpg"},
{title:"One Punch Man",ep:"Episode 12",img:"https://image.tmdb.org/t/p/w342/iE3s0lG5QVdEHOEZnoAxAUmwcy.jpg"}
];
const defaults=[
{id:"watching",name:"Sedang Ditonton",color:"#f04452",desc:"Lanjutkan tontonanmu",items:[0,1,2]},
{id:"completed",name:"Selesai",color:"#50c878",desc:"Anime yang sudah selesai",items:[3,4,5]},
{id:"planning",name:"Planning",color:"#e8b34a",desc:"Masuk daftar berikutnya",items:[6,7]},
{id:"dropped",name:"Dropped",color:"#8b8b99",desc:"Tidak dilanjutkan",items:[4]},
{id:"favorites",name:"Favorit",color:"#b58cff",desc:"Koleksi pilihanmu",items:[0,5,6]}
];
let folders=JSON.parse(JSON.stringify(defaults)),activePage="list",activeFolder=null;
const $=s=>document.querySelector(s);
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",1800)}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderNav(){$("#folderNav").innerHTML=folders.map(f=>'<button class="folder-link" data-folder="'+f.id+'"><i class="dot" style="--dot:'+f.color+'"></i><span>'+safe(f.name)+'</span><span class="count">'+f.items.length+'</span></button>').join("");}
function card(f){let imgs=f.items.slice(0,3).map(i=>'<img class="poster" src="'+art[i].img+'" alt="" onerror="this.style.opacity=.25">').join("");return '<button class="folder-card" data-open="'+f.id+'"><div class="stack">'+imgs+'</div><div class="folder-info"><div class="folder-title"><i class="dot" style="--dot:'+f.color+'"></i>'+safe(f.name)+'</div><p>'+safe(f.desc)+'</p><div class="mini-row"><i class="tiny-dot" style="--dot:'+f.color+'"></i>'+f.items.length+' anime <span>·</span> Buka koleksi</div></div></button>'}
function animeCards(items){return items.map(i=>'<article class="anime-card"><img loading="lazy" src="'+art[i].img+'" alt="'+safe(art[i].title)+'" onerror="this.style.opacity=.25"><div><strong>'+safe(art[i].title)+'</strong><small>'+safe(art[i].ep)+'</small><div style="display:flex;gap:6px;margin-top:10px"><button class="small-btn" data-remove="'+i+'" style="padding:5px 7px;font-size:11px">Hapus</button><button class="small-btn" data-move="'+i+'" style="padding:5px 7px;font-size:11px">Pindah</button></div></div></article>').join("")}
function render(){renderNav();const c=$("#content");$("#crumb").textContent=activeFolder?folders.find(f=>f.id===activeFolder)?.name||"My List":({list:"My List",discover:"Discover",settings:"Settings"}[activePage]||"My List");
if(activePage==="settings"){c.innerHTML='<div class="hero"><div><div class="eyebrow">Preferensi</div><h1>Settings</h1><p>Pengaturan tampilan untuk preview ini.</p></div></div><div class="folder-grid"><button class="folder-card" id="toggleTheme" style="grid-template-columns:1fr"><div class="folder-info"><div class="folder-title">☼ Tema tampilan</div><p>Ganti antara mode gelap dan terang.</p><span class="mini-row">Tema sekarang: '+(document.body.classList.contains("light")?"Terang":"Gelap")+'</span></div></button><button class="folder-card" id="addFolder" style="grid-template-columns:1fr"><div class="folder-info"><div class="folder-title">＋ Buat folder contoh</div><p>Tambahkan koleksi untuk mencoba navigasi.</p></div></button></div>';return}
if(activePage==="discover"){c.innerHTML='<div class="hero"><div><div class="eyebrow">Jelajahi</div><h1>Discover</h1><p>Daftar contoh untuk mencoba pencarian dan penambahan ke koleksi.</p></div></div><div class="toolbar"><input class="search" id="search" placeholder="Cari judul anime..."></div><div class="anime-grid" id="animeGrid">'+animeCards(art.map((_,i)=>i))+'</div>';return}
if(activeFolder){const f=folders.find(x=>x.id===activeFolder);if(!f){activeFolder=null;render();return}c.innerHTML='<div class="detail-head"><button class="back" id="back">← Kembali</button><div><div class="eyebrow">Koleksi</div><h1 style="font-size:27px;margin:4px 0">'+safe(f.name)+'</h1></div><button class="small-btn" id="rename">⋯</button></div><p style="color:var(--muted);margin-top:-12px;margin-bottom:22px">'+safe(f.desc)+' · '+f.items.length+' anime</p><div class="toolbar"><input class="search" id="search" placeholder="Cari dalam folder..."><button class="filter" id="addAnime">＋ Tambah anime</button></div><div class="anime-grid" id="animeGrid">'+(f.items.length?animeCards(f.items):'<div class="empty">Folder ini masih kosong.</div>')+'</div>';return}
c.innerHTML='<div class="hero"><div><div class="eyebrow">Perpustakaanmu</div><h1>My List</h1><p>Atur anime dalam koleksi yang kamu buat sendiri.</p></div><button class="primary" id="addFolder">＋ Folder baru</button></div><div class="toolbar"><input class="search" id="search" placeholder="Cari folder..."><select class="filter" id="sort"><option value="name">Nama A–Z</option><option value="count">Jumlah anime</option></select></div><div class="folder-grid" id="folderGrid">'+folders.map(card).join("")+'</div>';
}
function toggleTheme(){document.body.classList.toggle("light");render();toast("Tema preview diubah")}
function addFolder(){const name=prompt("Nama folder baru:");if(!name||!name.trim())return;const id="custom-"+Date.now();folders.push({id,name:name.trim(),color:["#f04452","#50c878","#e8b34a","#8b8bff","#2cb7a5"][folders.length%5],desc:"Folder kustom",items:[]});render();toast("Folder dibuat")}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.page){activePage=b.dataset.page;activeFolder=null;render()}if(b.dataset.folder){activePage="list";activeFolder=b.dataset.folder;render()}if(b.dataset.open){activePage="list";activeFolder=b.dataset.open;render()}if(b.id==="themeBtn"||b.id==="toggleTheme")toggleTheme();if(b.id==="resetBtn"){folders=JSON.parse(JSON.stringify(defaults));activeFolder=null;activePage="list";render();toast("Preview direset")}if(b.id==="addFolder")addFolder();if(b.id==="back"){activeFolder=null;render()}if(b.id==="rename"){const f=folders.find(x=>x.id===activeFolder);const n=prompt("Nama folder:",f.name);if(n&&n.trim()){f.name=n.trim();render()}}if(b.id==="addAnime"){const f=folders.find(x=>x.id===activeFolder);const choices=art.map((a,i)=>i).filter(i=>!f.items.includes(i));if(!choices.length){toast("Semua contoh anime sudah ada");return}const pick=prompt("Masukkan nomor anime:\n"+choices.map(i=>(i+1)+". "+art[i].title).join("\n"));const idx=Number(pick)-1;if(choices.includes(idx)){f.items.push(idx);render()}else if(pick!==null)toast("Nomor tidak valid")}if(b.dataset.remove!==undefined){const f=folders.find(x=>x.id===activeFolder);if(f){f.items=f.items.filter(i=>i!==Number(b.dataset.remove));render()}}if(b.dataset.move!==undefined){const i=Number(b.dataset.move);const f=folders.find(x=>x.id===activeFolder);const options=folders.filter(x=>x.id!==activeFolder);const pick=prompt("Pindahkan ke folder:\n"+options.map((x,j)=>(j+1)+". "+x.name).join("\n"));const dest=options[Number(pick)-1];if(dest){if(!dest.items.includes(i))dest.items.push(i);f.items=f.items.filter(x=>x!==i);render()}}});
document.addEventListener("input",e=>{if(e.target.id!=="search")return;const q=e.target.value.toLowerCase();if(activePage==="discover"){const ids=art.map((a,i)=>i).filter(i=>art[i].title.toLowerCase().includes(q));$("#animeGrid").innerHTML=ids.length?animeCards(ids):'<div class="empty">Tidak ada judul yang cocok.</div>'}else if(activeFolder){const f=folders.find(x=>x.id===activeFolder);const ids=f.items.filter(i=>art[i].title.toLowerCase().includes(q));$("#animeGrid").innerHTML=ids.length?animeCards(ids):'<div class="empty">Tidak ada judul yang cocok.</div>'}else{const fs=folders.filter(f=>f.name.toLowerCase().includes(q));$("#folderGrid").innerHTML=fs.length?fs.map(card).join(""):'<div class="empty">Folder tidak ditemukan.</div>'}});
document.addEventListener("change",e=>{if(e.target.id==="sort"){folders.sort((a,b)=>e.target.value==="count"?b.items.length-a.items.length:a.name.localeCompare(b.name));render()}});
render();
</script>
</body>
</html>
