name: Build Android APK
# Feature branches run the same arm64 release build for validation.
# Build trigger refreshed for the latest episode detail layout changes.

on:
  push:
    branches:
      - main
      - feat/cinematic-ambient-lighting
      - feat/auto-translate-synopsis
      - feat/portrait-episode-details
      - fix/preserve-latest-features-ui
      - fix/episode-detail-resume-ui-bugs
      - fix/episode-cards-border-autoscroll
    paths-ignore:
      - "preview/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      # Configure these four GitHub Actions secrets once to keep the APK
      # signature stable across builds, so Android can update in place.
      - name: Configure persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          else
            echo "No persistent signing secrets configured; APK will use runner debug signing."
          fi

      - name: Build arm64 release APK
        env:
          BUILD_NAME: 2.5.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$BUILD_NAME" \
            --build-number="$((30000 + BUILD_NUMBER))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zangetsu-android-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Publish only builds from the active development branch. Other branches
      # still produce downloadable Actions artifacts, but never replace the
      # update offered to users.
      - name: Publish in-app update release
        if: github.ref == 'refs/heads/fix/episode-cards-border-autoscroll'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.${{ github.run_number }}
          name: Zangetsu 2.5.${{ github.run_number }}
          body: |
            Automatic ARM64 build from commit ${{ github.sha }}.

            This pre-release was published after the Android APK build completed successfully.
          prerelease: true
          make_latest: false
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
