name: Deploy Zangetsu UI Preview

on:
  push:
    branches: [main]
    paths:
      - "preview/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zangetsu-ui-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload standalone preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
